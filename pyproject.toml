[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant"
version = "0.1.0"
description = "A real-time authorization service for AI agents -- graph-based access control, every decision hash-chained and audited."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naomy Tcheums", email = "naomytcheums@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "cryptography>=42",
    "warren",
    "ledger",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/naomytcheums-dotcom/warrant"
Source = "https://github.com/naomytcheums-dotcom/warrant"

[tool.setuptools.packages.find]
where = ["src"]
