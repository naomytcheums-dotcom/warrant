name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install warren and ledger (not yet on PyPI, installed from source)
        run: |
          pip install "git+https://github.com/naomytcheums-dotcom/warren.git"
          pip install "git+https://github.com/naomytcheums-dotcom/ledger.git"

      - name: Install warrant (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t warrant:ci-check .

      - name: Run it and smoke-test /health
        run: |
          docker run -d -p 8000:8000 --name warrant-ci warrant:ci-check
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "warrant never became healthy"; docker logs warrant-ci; exit 1
